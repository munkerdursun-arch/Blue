# Projet Xcode généré par XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Sur le Mac :  brew install xcodegen  puis  xcodegen generate  dans ce dossier.
#
# ➜ UNE SEULE CHOSE À MODIFIER : BUNDLE_ID_BASE (ligne plus bas).
#   Remplace "com.tonprenom" par quelque chose d'unique, ex. "com.mehmetd".
#   L'équipe de signature se choisit ensuite dans Xcode (onglet Signing & Capabilities).

name: BornWidgets
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    BUNDLE_ID_BASE: com.tonprenom.bornwidgets
    APP_GROUP_ID: group.$(BUNDLE_ID_BASE)
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  BornWidgets:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Born
        CFBundleDevelopmentRegion: fr
        AppGroupID: $(APP_GROUP_ID)
        NSLocationWhenInUseUsageDescription: "Ta position sert uniquement à récupérer la météo locale, qui influence l'autonomie estimée."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/BornWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: BornWidgetsExtension

  BornWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Born
        CFBundleDevelopmentRegion: fr
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/BornWidgetsExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).widgets
        TARGETED_DEVICE_FAMILY: "1"
